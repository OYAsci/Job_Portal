<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Register</title>
</head>
<body>

  <div class="header">
    <h1>Register</h1>
    <p>Create a new account</p>
  </div>

  <div class="topnav">
    <a href="index.html">Home</a>
    <a href="Register.html" style="float:right">Register</a>
    <a href="Login.html" style="float:right">Login</a>
  </div>

  <div class="register-container">
    <h2>Registration Form</h2>

    <form id="registerForm">
      <label>First name</label><br><br>
      <input type="text" id="first_name" required><br><br><br>

      <label>Last name</label><br><br>
      <input type="text" id="last_name" required><br><br><br>

      <label>Email</label><br><br>
      <input type="email" id="email" required><br><br><br>

      <label>Password</label><br><br>
      <input type="password" id="password" required><br><br><br>

      <button type="submit">Create account</button>
    </form>
  </div>

  <script src="Register.js"></script>
</body>
</html>
